org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Forge 官方仓库在国内经常卡在 keep-alive 上，调大超时
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000

# 【重要】ForgeGradle 6 内部硬编码了 https://maven.minecraftforge.net 来下载
# mcp_config / forge universal / client jar，这段下载不受上面 repositories 的镜像影响，
# 实测只有约 4KB/s。如果你有本地代理（Clash/v2ray 等），取消下面两行注释即可：
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890

minecraft_version=1.20.1
forge_version=47.3.0
mod_id=ieaddon
mod_name=IE Addon Template
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.ieaddon
mod_authors=YourName
mod_description=An Immersive Engineering addon template.
